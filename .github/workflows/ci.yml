name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: oven-sh/setup-bun@v2
        if: matrix.os == 'ubuntu-latest'
        with:
          bun-version: 1.3.14
      - name: Test embedded shutdown with Bun
        if: matrix.os == 'ubuntu-latest'
        run: BUN_EXE="$(bun -e 'process.stdout.write(process.execPath)')" npm run test:unit
      - name: Verify committed distribution artifacts
        run: git diff --exit-code -- dist
